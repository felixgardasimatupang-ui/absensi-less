version: '3.8'

services:
  backend:
    image: node:22-alpine
    container_name: absensiles_backend
    working_dir: /app/backend
    command: sh -c "npm ci && npx prisma generate && npx ts-node src/server.ts"
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      JWT_SECRET: change-this-secret-in-production
      DATABASE_URL: file:./prisma/dev.db
    volumes:
      - .:/app
