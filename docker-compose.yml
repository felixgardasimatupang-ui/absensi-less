version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: absensiles_postgres
    restart: always
    environment:
      POSTGRES_USER: absensiles_user
      POSTGRES_PASSWORD: absensiles_password
      POSTGRES_DB: absensiles_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
